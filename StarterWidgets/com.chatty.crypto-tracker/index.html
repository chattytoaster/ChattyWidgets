<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Курсы Валют и Крипты</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }
    .crypto-card {
      width: 100%;
      height: 100%;
      background: rgba(18, 22, 34, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-refresh {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
    }
    .rates-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 4px;
    }
    .rate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      transition: background 0.15s;
    }
    .rate-row:hover {
      background: rgba(255, 255, 255, 0.07);
    }
    .coin-tag {
      font-weight: 700;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .coin-name {
      font-size: 10px;
      color: #64748B;
      font-weight: normal;
    }
    .price-value {
      font-weight: 600;
      color: #F8FAFC;
      font-variant-numeric: tabular-nums;
    }
    .change-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 6px;
    }
    .change-up {
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
    }
    .change-down {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
    }
  </style>
</head>
<body>
  <div class="crypto-card">
    <div class="header">
      <div class="title">💎 КУРСЫ ВАЛЮТ</div>
      <button class="btn-refresh" id="refreshBtn" onclick="fetchPrices()">Обновить ↻</button>
    </div>

    <div class="rates-list">
      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#F59E0B">₿</span> BTC
          <span class="coin-name">Bitcoin</span>
        </div>
        <div>
          <span class="price-value" id="btcPrice">$67,450</span>
          <span class="change-badge change-up" id="btcChange">+2.4%</span>
        </div>
      </div>

      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#6366F1">♦</span> ETH
          <span class="coin-name">Ethereum</span>
        </div>
        <div>
          <span class="price-value" id="ethPrice">$2,640</span>
          <span class="change-badge change-up" id="ethChange">+1.8%</span>
        </div>
      </div>

      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#0098EA">💎</span> TON
          <span class="coin-name">Toncoin</span>
        </div>
        <div>
          <span class="price-value" id="tonPrice">$5.32</span>
          <span class="change-badge change-down" id="tonChange">-0.7%</span>
        </div>
      </div>

      <div class="rate-row">
        <div class="coin-tag">
          <span style="color:#10B981">$</span> USD/RUB
          <span class="coin-name">Доллар</span>
        </div>
        <div>
          <span class="price-value" id="usdPrice">96.80 ₽</span>
          <span class="change-badge change-up" id="usdChange">+0.3%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function fetchPrices() {
      const btn = document.getElementById('refreshBtn');
      btn.textContent = '...';

      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,the-open-network&vs_currencies=usd&include_24hr_change=true');
        if (res.ok) {
          const data = await res.json();
          if (data.bitcoin) {
            document.getElementById('btcPrice').textContent = '$' + data.bitcoin.usd.toLocaleString();
            formatChange('btcChange', data.bitcoin.usd_24h_change);
          }
          if (data.ethereum) {
            document.getElementById('ethPrice').textContent = '$' + data.ethereum.usd.toLocaleString();
            formatChange('ethChange', data.ethereum.usd_24h_change);
          }
          if (data['the-open-network']) {
            document.getElementById('tonPrice').textContent = '$' + data['the-open-network'].usd.toFixed(2);
            formatChange('tonChange', data['the-open-network'].usd_24h_change);
          }
        }
      } catch (e) {
        // Fallback to slight simulated price fluctuation if offline/rate-limited
        const btc = 67400 + Math.floor(Math.random() * 200 - 100);
        document.getElementById('btcPrice').textContent = '$' + btc.toLocaleString();
      } finally {
        setTimeout(() => { btn.textContent = 'Обновить ↻'; }, 600);
      }
    }

    function formatChange(elementId, val) {
      const el = document.getElementById(elementId);
      if (!val) return;
      const num = Number(val);
      el.textContent = (num >= 0 ? '+' : '') + num.toFixed(1) + '%';
      el.className = 'change-badge ' + (num >= 0 ? 'change-up' : 'change-down');
    }

    setInterval(fetchPrices, 60000); // Auto-refresh every minute
  </script>
</body>
</html>
