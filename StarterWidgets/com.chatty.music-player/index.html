<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мини-Медиаплеер</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }
    .player-card {
      width: 100%;
      height: 100%;
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }
    .art-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: conic-gradient(from 180deg at 50% 50%, #EC4899 0deg, #8B5CF6 180deg, #3B82F6 360deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.4);
      animation: spin 12s linear infinite;
      flex-shrink: 0;
    }
    .art-ring.paused {
      animation-play-state: paused;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .art-center {
      width: 22px;
      height: 22px;
      background: #111420;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }
    .track-info {
      flex: 1;
      min-width: 0;
    }
    .track-title {
      font-size: 14px;
      font-weight: 600;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .track-artist {
      font-size: 12px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #F8FAFC;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.08);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-play {
      background: #6366F1;
      width: 36px;
      height: 36px;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }
    .btn-play:hover {
      background: #4F46E5;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="art-ring" id="artRing">
      <div class="art-center"></div>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Медиа Windows</div>
      <div class="track-artist" id="trackArtist">Управление музыкой</div>

      <div class="controls">
        <button class="btn" title="Предыдущий" onclick="prevTrack()">⏮</button>
        <button class="btn btn-play" id="playBtn" title="Воспроизведение / Пауза" onclick="togglePlay()">▶</button>
        <button class="btn" title="Следующий" onclick="nextTrack()">⏭</button>
        <button class="btn" title="Тише" onclick="volDown()" style="margin-left: 6px; font-size: 11px;">🔉</button>
        <button class="btn" title="Громче" onclick="volUp()" style="font-size: 11px;">🔊</button>
      </div>
    </div>
  </div>

  <script>
    let isPlaying = false;

    function togglePlay() {
      if (window.chatty) {
        window.chatty.playPause();
      }
      isPlaying = !isPlaying;
      updatePlayState();
    }

    function prevTrack() {
      if (window.chatty) window.chatty.prevTrack();
    }

    function nextTrack() {
      if (window.chatty) window.chatty.nextTrack();
    }

    function volDown() {
      if (window.chatty) window.chatty.volumeDown();
    }

    function volUp() {
      if (window.chatty) window.chatty.volumeUp();
    }

    function updatePlayState() {
      const btn = document.getElementById('playBtn');
      const ring = document.getElementById('artRing');
      if (isPlaying) {
        btn.textContent = '⏸';
        ring.classList.remove('paused');
      } else {
        btn.textContent = '▶';
        ring.classList.add('paused');
      }
    }

    updatePlayState();
  </script>
</body>
</html>
