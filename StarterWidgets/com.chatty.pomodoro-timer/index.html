<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Focus Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pomodoro-card">
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-mode-work" onclick="setMode('work')">🍅 Фокус 25м</button>
            <button class="mode-btn break" id="btn-mode-break" onclick="setMode('break')">☕ Отдых 5м</button>
        </div>

        <div class="timer-display">
            <div class="time" id="timer-text">25:00</div>
            <div class="session-info">
                <span>Сессий завершено:</span>
                <strong id="session-count" style="color:#F8FAFC;">0</strong>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn btn-primary" id="btn-toggle" onclick="toggleTimer()">Старт</button>
            <button class="action-btn btn-secondary" onclick="resetTimer()">Сброс</button>
        </div>
    </div>

    <script>
        let mode = 'work'; // 'work' or 'break'
        let timeLeft = 25 * 60;
        let isRunning = false;
        let timerInterval = null;
        let sessionsCompleted = 0;

        try {
            if (window.chatty && window.chatty.storageGet) {
                sessionsCompleted = parseInt(window.chatty.storageGet('sessions', '0')) || 0;
                document.getElementById('session-count').innerText = sessionsCompleted;
            }
        } catch (e) {}

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3); // A5
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } catch (e) {}
        }

        function updateDisplay() {
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            const str = String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
            const el = document.getElementById('timer-text');
            el.innerText = str;
            if (mode === 'break') {
                el.classList.add('break-time');
            } else {
                el.classList.remove('break-time');
            }
        }

        function setMode(m) {
            if (isRunning) toggleTimer();
            mode = m;
            document.getElementById('btn-mode-work').classList.toggle('active', mode === 'work');
            document.getElementById('btn-mode-break').classList.toggle('active', mode === 'break');
            timeLeft = mode === 'work' ? 25 * 60 : 5 * 60;
            updateDisplay();
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-toggle');
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btn.innerText = 'Продолжить';
                btn.style.background = mode === 'work' ? '#EF4444' : '#10B981';
            } else {
                isRunning = true;
                btn.innerText = 'Пауза';
                btn.style.background = '#475569';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btn.innerText = 'Старт';
                        btn.style.background = mode === 'work' ? '#EF4444' : '#10B981';
                        playChime();

                        if (mode === 'work') {
                            sessionsCompleted++;
                            document.getElementById('session-count').innerText = sessionsCompleted;
                            if (window.chatty && window.chatty.storageSet) {
                                window.chatty.storageSet('sessions', String(sessionsCompleted));
                            }
                            if (window.chatty && window.chatty.notify) {
                                window.chatty.notify('🍅 Pomodoro завершён!', 'Отличная работа! Сделайте 5-минутный перерыв для отдыха.');
                            }
                            setMode('break');
                        } else {
                            if (window.chatty && window.chatty.notify) {
                                window.chatty.notify('☕ Перерыв окончен!', 'Пора возвращаться к продуктивной работе.');
                            }
                            setMode('work');
                        }
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            if (isRunning) toggleTimer();
            timeLeft = mode === 'work' ? 25 * 60 : 5 * 60;
            updateDisplay();
            document.getElementById('btn-toggle').innerText = 'Старт';
        }

        updateDisplay();
    </script>
</body>
</html>
